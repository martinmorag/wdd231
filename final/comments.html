<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comments - Your Next Hike</title>
    <meta name="author" content="Martin Marcelo Moraga Lopez">
    <meta name="description"
        content="Welcome to Your Next Hike, feel welcome to tell us about where you have been and how was it.">
    <meta property="og:title" content="Welcome to the comments page of Your Next Hike">
    <meta property="og:description"
        content="Welcome to Your Next Hike, feel welcome to tell us about where you have been and how was it.">
    <meta property="og:image" content="https://martinmorag.github.io/wdd231/final/images/hero.webp">
    <meta property="og:locale" content="en_US">
    <meta property="og:url" content="https://martinmorag.github.io/wdd231/final/discover.html">
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/comments.css">
    <link rel="icon" href="favicon.ico">
    <script type="module" src="scripts/comments.mjs"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>
<body>
    <header>
        <div>
            <img src="images/logo.svg" alt="Site Logo" width="1" height="1">
            <span>Your Next Hike</span>
            <button id="nav-button" class="hamburger" aria-label="navigation"></button>
        </div>
        <nav id="nav-bar" class="navigation">
            <ul>
                <li><a href="/wdd231/final/index.html">Home</a></li>
                <li><a href="/wdd231/final/discover.html">Trails</a></li>
                <li><a href="/wdd231/final/comments.html">Comments</a></li>
            </ul>
        </nav>
        
    </header>
    <main>
        <h1>Comment section</h1>
        <p class="subtitle">Tell us about your experiences while hiking!</p>
        <section class="post">
            <form method="post">
                <label>Your name</label>
                <input type="text" name="name" required>
                <label>Where did you go?</label>
                <input type="text" name="place" required>
                <label>Date</label>
                <input type="date" name="date" required>
                <label>Tell us your experience</label>
                <textarea name="comment" rows="5" required></textarea>
                <input type="submit" value="Share your experience">
            </form>
        </section>
        <section class="comments-container">
            <h2>Comments</h2>
            <div class="comments"></div>
        </section>
        <dialog id="placeDetails"></dialog>
    </main>
    <footer>
            <p>WDD231 Class Project</p>
            <p>Martin Moraga</p>
            <p>&#169; 2026 - Your Next Hike</p>
            <p>Link to video: <a href="https://youtu.be/JSugLMCLoOs" target="_blank">Click here</a></p>
    </footer>
</body>
</html>
